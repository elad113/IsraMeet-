name: Build IsraMeet Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - name: Register IsraMeet invitation deep links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          intent = """        <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="isrameet" android:host="invite" />
                  </intent-filter>
          """
          if 'android:scheme="isrameet"' not in s:
              pos = s.find("</activity>")
              if pos < 0:
                  raise SystemExit("MainActivity declaration not found")
              s = s[:pos] + intent + s[pos:]
              p.write_text(s)
          PY
      - name: Add notification icon and permissions
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_isrameet.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4a1.5,1.5 0,0 0,-3 0v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1z" />
          </vector>
          EOF
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml
      - name: Create three-second notification melody
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import math, os, struct, wave
          rate = 22050
          notes = [659.25, 783.99, 987.77]
          with wave.open("android/app/src/main/res/raw/isrameet_notice.wav", "wb") as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for i in range(rate * 3):
                  t = i / rate
                  freq = notes[min(int(t), 2)]
                  local = t % 1.0
                  envelope = min(1.0, local * 18) * min(1.0, (1.0-local) * 8)
                  sample = int(9000 * envelope * (math.sin(2*math.pi*freq*t) + 0.22*math.sin(4*math.pi*freq*t)))
                  frames.extend(struct.pack("<h", sample))
              out.writeframes(frames)
          PY
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsraMeet-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare stable download filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IsraMeet.apk
      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: isrameet-build-${{ github.run_number }}
          name: IsraMeet build ${{ github.run_number }}
          body: Automated IsraMeet Android build. Download IsraMeet.apk to install the latest version.
          files: IsraMeet.apk
          make_latest: true
# Every successful build publishes the APK at /releases/latest/download/IsraMeet.apk.
