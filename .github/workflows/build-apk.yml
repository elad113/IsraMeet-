name: Build CodeQuest APK from latest AppDeploy source
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install website dependencies
        run: npm install
      - name: Build copied CodeQuest website
        run: npm run build
      - name: Bundle website files into APK
        run: |
          mkdir -p app/src/main/assets/web
          cp -R dist/. app/src/main/assets/web/
          test -s app/src/main/assets/web/index.html
          find app/src/main/assets/web -type f -maxdepth 4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: codequest-fresh-appdeploy-copy-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
