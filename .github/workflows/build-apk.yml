name: Build CodeQuest APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web dependencies
        run: npm install
      - name: Build actual CodeQuest website
        run: npm run build
      - name: Package website inside Android app
        run: |
          mkdir -p app/src/main/assets/web
          cp -R dist/. app/src/main/assets/web/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: codequest-website-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14